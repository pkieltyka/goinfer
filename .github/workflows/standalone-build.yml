# standalone-build — the gate RELEASING.md says proves the shipped tags do not need a go.work.
#
# M-34: RELEASING.md said "CI's standalone-build step (below) is what proves" it, and no such
# step existed: `.github/workflows/ci.yml` has no GOWORK=off anywhere (every submodule job runs
# `go work init`). The B-01…B-04 class was caught only by a human running Step 2 by hand at tag
# time.
#
# WHY THIS IS NOT IN ci.yml. A submodule built with GOWORK=off resolves the goinfer root from
# the module proxy at its LAST PUBLISHED TAG. Between releases that legitimately fails — a
# submodule using a root symbol added since the last tag reports "method not found" on perfectly
# good code. Running it on every push would make CI red by design and train everyone to ignore
# it. At TAG time the root tag is published, which is exactly when the answer is meaningful and
# exactly what the release depends on.
name: standalone-build

on:
  push:
    tags:
      - 'v*'
      - 'backend/cuda/v*'
      - 'backend/metal/v*'
      - 'backend/vulkan/v*'
      - 'gpu/v*'
      - 'cuda/v*'
      - 'metal/v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: backend/cuda
            tags: cuda
          - module: backend/metal
            tags: metal
          - module: backend/vulkan
            tags: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # metal/ is darwin-only and cuda/ is linux-only for its cgo-free dlopen path; both still
      # COMPILE cross-target with GOOS set, which is what this gate needs — it is asking whether
      # the module resolves without a workspace, not whether it runs here.

      # NO `go work init`. That is the whole point: this must resolve the goinfer root from the
      # proxy, the way `go install github.com/pkieltyka/goinfer/<module>@<tag>` does for a
      # user. GOWORK=off also defends against a stray go.work in the runner image.
      #
      # Selection rule:
      #   - workflow_dispatch: verify all three backend modules.
      #   - refs/tags/<module>/v*: verify that submodule unconditionally.
      #   - refs/tags/v*: verify each submodule whose go.mod pins this root tag (single-commit
      #     release); report unpinned/omitted backends explicitly instead of failing on a stale
      #     pin for a backend that was not part of this release.
      - name: standalone build and vet (GOWORK=off)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, format('refs/tags/{0}/', matrix.module)) ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '/'))
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.module == 'backend/metal' && 'darwin' || 'linux' }}
          GOARCH: ${{ matrix.module == 'backend/metal' && 'arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          cd "${{ matrix.module }}"
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            if ! grep -Eq "^[[:space:]]*github\.com/pkieltyka/goinfer[[:space:]]+${{ github.ref_name }}([[:space:]]|$)" go.mod; then
              echo "Skipping ${{ matrix.module }}: go.mod does not pin github.com/pkieltyka/goinfer ${{ github.ref_name }} (backend omitted from this release)."
              exit 0
            fi
          fi
          if [ -n "${{ matrix.tags }}" ]; then
            go vet -tags '${{ matrix.tags }}' ./...
            go build -tags '${{ matrix.tags }}' ./...
          else
            go vet ./...
            go build ./...
          fi
