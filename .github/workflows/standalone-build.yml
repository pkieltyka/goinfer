# standalone-build — the gate RELEASING.md says proves the shipped tags do not need a go.work.
#
# M-34: RELEASING.md said "CI's standalone-build step (below) is what proves" it, and no such
# step existed: `.github/workflows/ci.yml` has no GOWORK=off anywhere (every submodule job runs
# `go work init`). The B-01…B-04 class was caught only by a human running Step 2 by hand at tag
# time.
#
# WHY THIS IS NOT IN ci.yml. A submodule built with GOWORK=off resolves the goinfer root from
# the module proxy at its LAST PUBLISHED TAG. Between releases that legitimately fails — a
# submodule using a root symbol added since the last tag reports "method not found" on perfectly
# good code. Running it on every push would make CI red by design and train everyone to ignore
# it. At TAG time the root tag is published, which is exactly when the answer is meaningful and
# exactly what the release depends on.
name: standalone-build

on:
  push:
    tags:
      - 'v*'
      - 'backend/cuda/v*'
      - 'backend/metal/v*'
      - 'backend/vulkan/v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
      GOPROXY: "https://proxy.golang.org"
      GOSUMDB: "sum.golang.org"
      GONOPROXY: "none"
      GONOSUMDB: "none"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: standalone build of the module this ref names
        run: |
          set -euo pipefail
          root_path=github.com/pkieltyka/goinfer
          tagged=1
          case "$GITHUB_REF" in
            refs/tags/backend/cuda/v*)   modules=(backend/cuda) ;;
            refs/tags/backend/vulkan/v*) modules=(backend/vulkan) ;;
            refs/tags/backend/metal/v*)  modules=(backend/metal) ;;
            refs/tags/v*)                modules=(root) ;;
            refs/heads/*)                modules=(root backend/cuda backend/vulkan backend/metal); tagged=0 ;;
            *)                           echo "No standalone module for $GITHUB_REF" >&2; exit 1 ;;
          esac

          # The mirror can cache a missing version. Check the root tag before
          # sending the public proxy any request that could name it.
          for module in "${modules[@]}"; do
            dir="$module"
            goos=linux
            goarch=amd64
            tags=()
            case "$module" in
              root) dir=. ;;
              backend/cuda) tags=(-tags cuda) ;;
              backend/metal) goos=darwin; goarch=arm64; tags=(-tags metal) ;;
            esac
            if [ "$module" != root ]; then
              ver="$(awk -v p="$root_path" '$1==p{print $2; exit} $1=="require"&&$2==p{print $3; exit}' "$dir/go.mod")"
              why=""
              if [[ "$ver" =~ [.-][0-9]{14}-[0-9a-f]{12}(\+incompatible)?$ ]]; then
                why="pins the root at pseudo-version $ver"
              elif ! [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
                why="requires a root release version, got ${ver:-none}"
              elif git ls-remote --exit-code --refs origin "refs/tags/$ver" >/dev/null; then
                :
              else
                status=$?
                if [ "$status" -ne 2 ]; then
                  echo "$module: could not check the root tag $ver" >&2
                  exit "$status"
                fi
                why="pins root $ver, which is not a pushed tag"
              fi
              if [ -n "$why" ]; then
                if [ "$tagged" = 1 ]; then echo "$module $why" >&2; exit 1; fi
                echo "::warning::$module $why; NOT CHECKED in this manual run"
                continue
              fi
            fi

            echo "== $module (GOOS=$goos GOARCH=$goarch)"
            (
              cd "$dir"
              export GOOS="$goos" GOARCH="$goarch"
              if [ "$module" = backend/cuda ] || [ "$module" = backend/vulkan ]; then export CGO_ENABLED=0; fi
              missing='(^|[[:space:]])reading https://proxy\.golang\.org/[^[:space:]]+: (404 Not Found|410 Gone)[[:space:]]*$'
              for attempt in 1 2 3 4 5; do
                if out="$(go mod download 2>&1)"; then break; fi
                printf '%s\n' "$out" >&2
                grep -Eq "$missing" <<<"$out" || exit 1
                # A separate module error in the same invocation remains fatal.
                if grep -Ei '^go:|checksum mismatch|SECURITY ERROR' <<<"$out" | grep -Ev "$missing" >/dev/null; then
                  exit 1
                fi
                [ "$attempt" -lt 5 ] || exit 1
                sleep 30
              done
              go build "${tags[@]}" ./...
              if [ "$module" != root ]; then go vet "${tags[@]}" ./...; fi
            )
          done
