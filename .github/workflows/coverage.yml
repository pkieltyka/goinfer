name: coverage

# Root module statement coverage, run nightly and on demand.
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  # A scheduled run skips when main's tip already has a successful coverage run (no commit since the last one). A
  # manual run always runs. Fail-open: any doubt runs coverage.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: already covered?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=false
          prev="(not checked)"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            prev=$(gh run list --workflow coverage.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$prev" ] && v=true
          fi
          echo "skip=$v" >> "$GITHUB_OUTPUT"
          echo "skip=$v  (sha=$GITHUB_SHA; an earlier successful coverage run on it: '${prev:-none}')"

  coverage:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: test with coverage (root)
        run: go test -timeout 40m -tags goinfer_testhooks -covermode=atomic -coverprofile=cov-root.out ./...
      - name: coverage summary
        run: go tool cover -func=cov-root.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: cov-root.out
          flags: root
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
