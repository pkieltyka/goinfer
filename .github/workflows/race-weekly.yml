name: race-weekly

# Run the race detector on Darwin arm64 to cover the platform-specific code paths.
# ci.yml runs the ordinary Darwin tests and the Linux race suites in its extended tier.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC (an hour after fuzz-weekly, not on top of it)
  workflow_dispatch: # and on demand

permissions:
  contents: read

jobs:
  race-darwin:
    name: darwin/arm64 -race (weekly)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: test -race (darwin/arm64)
        run: go test -race -timeout 40m -tags goinfer_testhooks ./...
